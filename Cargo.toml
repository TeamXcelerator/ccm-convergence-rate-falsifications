[package]
name = "ccm-falsifications"
version = "2.1.0"
edition = "2021"
rust-version = "1.98"
description = "Reproducible finite tests of CCM convergence approximations and spectral error"
authors = ["Ronnie Andrews, Jr. <5178942+TeamXceleratorDev@users.noreply.github.com>"]
license-file = "LICENSE"

[features]
default = []
# High-precision tier via rug (MPFR/GMP). Required for meaningful results.
# Build: cargo build --release --features hp
# Requires: sudo apt install build-essential m4 libgmp-dev libmpfr-dev libmpc-dev
hp = ["xc-spectral/hp", "xc-zeta/hp", "xc-numerics/hp", "dep:rug"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "integer"] }

# Xcelerator Toolkit — immutable release tag plus Cargo.lock commit pin.
xc-cache    = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "2bea90ec7cb23d4d615448c293c8af0f94e14119" }
xc-spectral = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "2bea90ec7cb23d4d615448c293c8af0f94e14119" }
xc-zeta     = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "2bea90ec7cb23d4d615448c293c8af0f94e14119" }
xc-numerics = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "2bea90ec7cb23d4d615448c293c8af0f94e14119" }

xc-core = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "2bea90ec7cb23d4d615448c293c8af0f94e14119" }

[profile.release]
opt-level = 3
lto = "thin"
